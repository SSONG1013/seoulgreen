<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="서울그린">
<meta name="theme-color" content="#1c2350">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>서울그린정형외과</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;background:#2a2f4a;color:#fff;font-family:"Jua",-apple-system,"Apple SD Gothic Neo",sans-serif;font-size:14px}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);background:repeating-linear-gradient(45deg,#2a2f4a 0 10px,#2d3350 10px 20px)}
#app{max-width:900px;margin:0 auto;padding:6px}
.win{background:linear-gradient(180deg,rgba(52,70,140,.96),rgba(24,32,78,.96));border:2px solid #fff;border-radius:6px;box-shadow:0 0 0 2px #10153a,0 4px 0 #10153a;padding:7px 9px;margin-bottom:7px}
.win h3{margin:0 0 5px;font-size:15px;font-weight:400;color:#ffe9a8}
button{font:inherit;color:#fff;background:linear-gradient(180deg,#5a6cc0,#36438a);border:2px solid #fff;border-radius:5px;padding:5px 9px;box-shadow:0 2px 0 #10153a}
button:active{transform:translateY(2px);box-shadow:none}
button:disabled{opacity:.35}
button.big{width:100%;font-size:18px;padding:11px;background:linear-gradient(180deg,#4fae7a,#2c7a52)}
button.gold{background:linear-gradient(180deg,#e2b54a,#a87a1c)}
small,.dim{color:#c3cbf0}
#play{display:flex;gap:8px;align-items:flex-start}
#play .main{flex:1 1 380px;max-width:480px;margin:0 auto;width:100%}
#play .side{flex:0 0 330px}
@media(max-width:760px){#play{flex-direction:column}#play .side{width:100%;flex:none;max-width:480px;margin:0 auto}}
canvas#map{width:100%;display:block;border:2px solid #fff;border-radius:6px;box-shadow:0 0 0 2px #10153a;image-rendering:pixelated;touch-action:manipulation;background:#000}
.hud .r{display:flex;justify-content:space-between;align-items:center;gap:4px}
.hud .btns{display:flex;gap:4px;margin-top:5px}.hud .btns button{padding:3px 7px;font-size:13px}
.hud .btns .chance{flex:1}
.meter{height:7px;background:#10153a;border:1px solid #9aa6e0;border-radius:4px;overflow:hidden;flex:1;margin-left:4px}
.meter u{display:block;height:100%}
.msg{min-height:52px;font-size:14px;line-height:1.45;position:relative}
.msg .nm{color:#ffe9a8}
.msg:after{content:"▼";position:absolute;right:8px;bottom:2px;font-size:10px;animation:blink 1s infinite}
@keyframes blink{50%{opacity:0}}
.staffs{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:5px}
.sc{border:2px solid #7f8bd0;border-radius:5px;padding:4px 6px;font-size:12px;background:rgba(0,0,0,.18)}
.sc.sel{border-color:#ffd54a;background:rgba(255,213,74,.18)}
.sc b{font-weight:400;color:#ffe9a8}
.bar{height:5px;background:#10153a;border-radius:3px;overflow:hidden;margin:1px 0}.bar u{display:block;height:100%}
.cl{font-size:12px;padding:3px 0;border-bottom:1px dashed rgba(255,255,255,.2)}
.lv0{color:#8ef0b0}.lv1{color:#c3cbf0}.lv2{color:#ffcf6e}.lv3{color:#ff8a8a}
table.t{width:100%;border-collapse:collapse;font-size:14px}table.t td{padding:3px 2px;border-bottom:1px dashed rgba(255,255,255,.2)}table.t td:last-child{text-align:right}
.it{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:6px 0;border-bottom:1px dashed rgba(255,255,255,.2)}
.it div{font-size:13px}
.cand{border:2px solid #9aa6e0;border-radius:6px;padding:6px;margin:5px 0;background:rgba(0,0,0,.18)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:3px;font-size:12px;text-align:center;margin:4px 0}
.stats span{background:rgba(0,0,0,.25);border-radius:4px;padding:2px}
.stats button{padding:0 6px;font-size:12px;margin-left:2px}
select{font:inherit;border:2px solid #fff;border-radius:5px;background:#36438a;color:#fff;padding:2px 4px}
h1{text-align:center;font-weight:400;font-size:34px;margin:30px 0 4px;color:#ffe9a8;text-shadow:0 3px 0 #10153a}
#toast{position:fixed;left:50%;top:14%;transform:translateX(-50%);background:rgba(16,21,58,.95);border:2px solid #fff;color:#fff;padding:8px 14px;border-radius:6px;font-size:14px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:20;max-width:90%;text-align:center}
#toast.on{opacity:1}
.legend{font-size:12px;color:#c3cbf0;margin:4px 2px 0;text-align:center}.legend i{font-style:normal;color:#1a1a1a;display:inline-block;width:15px;text-align:center;border-radius:3px;margin:0 2px 0 6px}.legend b{font-weight:400;color:#fff}
.foot{text-align:center;font-size:12px;color:#9aa6e0;margin-top:8px}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<script>
// ================= 기본 데이터 =================
const W=360,MONTH=20,DAY0=540,DAY1=1080;
const PRICE={modal:1000,shock:50000,manual:100000};
const BASE={modal:10,shock:10,manual:30};
const EXPG={modal:1,shock:3,manual:6};
const STN={hp:'체력',res:'스트레스 내성',mental:'정신력',skill:'전문기술'};
const LEVELS=['동네 1층 의원','리모델링 의원','2개 층 의원','재활 특화 의원','건물 전체 사용','정형외과 병원','재활센터 신관','스포츠재활 센터','서울그린 메디컬타워','서울그린 본원 & 2호점'];
const PAL=[['#e9e2cf','#ddd5bf','#8d7b62'],['#e6ece0','#d9e2d2','#7b8a6e'],['#f0e6d6','#e4d7c2','#9a7e5c'],['#e3edf2','#d4e2ea','#66808e'],['#e2cfb2','#d6c09f','#7a5c3e'],['#f3efe9','#e6e0d8','#5c6b73'],['#efe8f3','#e2d8ea','#6b5a7a'],['#e6f0ea','#d6e6dc','#476a58'],['#f4f1ea','#e8e2d4','#3e4a52'],['#fbf7ee','#efe7d6','#2e3b33']];
const TYPES={
  old:{label:'어르신',pat:90,rx:{shock:.25,manual:.10}},
  young:{label:'청년',pat:45,rx:{shock:.40,manual:.30}},
  aunt:{label:'아주머니',pat:65,rx:{shock:.25,manual:.45}}
};
const BOSSES=[
  {name:'할인 요구 아저씨',hp:300,weak:'mental',lines:['깎아줘요!','옆 병원은 더 싸던데?','카드 말고 현금가!']},
  {name:'수다쟁이 단골',hp:400,weak:'res',lines:['내 얘기 좀 들어봐','우리 며느리가 말이야~','아직 안 끝났어!']},
  {name:'인터넷 닥터',hp:500,weak:'skill',lines:['유튜브에선 이렇게 하던데?','그거 근거 있어요?','제가 찾아봤는데요']},
  {name:'리뷰 협박러',hp:700,weak:'hp',lines:['별점 1개 줄 거예요','리뷰 쓴다?','사장 나와!']}
];
const L={
  ptStart:['어디가 불편하세요?','오늘은 좀 어떠세요?','힘 빼세요~','조금 아플 수 있어요!','자세 바르게 해볼게요'],
  modal:['찜질 올려 드릴게요','따뜻하게 해드릴게요','전기치료 시작할게요'],
  old:['아이고 허리야…','선생님 손이 약손이네~','무릎이 쑤셔서 왔어','우리 손주가 말이야…'],
  young:['헬스하다 삐끗했어요','거북목 때문에요…','빨리 끝나나요?','어깨가 뭉쳤어요'],
  aunt:['여기 잘한다고 소문 듣고 왔어요','시원~하다!','아까 그 선생님 친절하더라','요 앞 반찬가게 알아요?'],
  done:['시원하다~!','훨씬 가벼워요!','또 올게요~','최고예요!','감사합니다~'],
  wait:['언제 불러요…','아직이에요?','시간 없는데…','배고프다…'],
  angry:['다신 안 와!','민원 넣을 거예요!','리뷰 쓸 거야!'],
  idle:['점심 뭐 먹지?','오늘 환자 많네…','커피 한 잔?','퇴근하고 싶다','원장님 기분 좋으시대','주말에 뭐 해?'],
  mgr:['접수 도와드릴게요','성함이 어떻게 되세요?','잠시만 기다려주세요~'],
  tired:['허리가 끊어질 것 같아…','오늘따라 힘드네','손목 나갈 것 같아']
};
const CMP2=['접수하고 30분째 아무도 안 불러요.','대기실이 너무 붐벼서 앉을 데가 없어요.','치료사분이 바빠서 설명을 못 들었어요.','안내 없이 계속 기다리기만 했어요.'];
const CMP3=['[온라인 리뷰 ★1] 기다리다 지쳐서 그냥 나왔습니다.','[보건소 민원] 대기 안내가 전혀 없었어요.','[동네 카페] 여기 요즘 별로래요…','[온라인 리뷰 ★2] 치료는 괜찮은데 너무 오래 기다려요.'];
const SKIN=['#f8dcc0','#f1caa4','#e9bb92'],HAIR=['#3b2a20','#5a3b28','#1f1b1b','#8a5a2b','#c98f4a','#4b3a6a'];
const PTOP=['#e57373','#64b5f6','#ffb74d','#9575cd','#4db6ac','#f06292','#a1887f','#81c784'];
const SUR='김이박최정강조윤장임한오서신권황안송류홍';
const GIV=['민','서','지','현','수','예','하','도','윤','준','은','채','유','진','연','아','우','주','태','다','소','나','혜','성'];
const r=n=>Math.floor(Math.random()*n),ri=(a,b)=>a+r(b-a+1),pick=a=>a[r(a.length)];
const rname=()=>SUR[r(SUR.length)]+pick(GIV)+pick(GIV);
const won=n=>Math.round(n).toLocaleString('ko-KR')+'원';
const man=n=>(n/10000).toLocaleString('ko-KR',{maximumFractionDigits:1})+'만';
const hm=t=>String(Math.floor(t/60)).padStart(2,'0')+':'+String(Math.floor(t%60)).padStart(2,'0');
const slots=lv=>Math.min(4,1+Math.ceil(lv/3));
const beds=lv=>Math.min(12,3+Math.floor(lv/3)+((S&&S.mbeds)||0));
const lvCost=lv=>Math.round(2000000*Math.pow(1.7,lv-1)/100000)*100000;
const maxHp=s=>60+s.st.hp*8;
const expNeed=s=>20+s.lv*15;
let uid=1,H=440,O=0;
const tier=()=>S.level<=3?0:S.level<=6?1:S.level<=9?2:3;
const seatN=()=>10+2*S.level,seatCols=()=>S.level>=4?5:4,seatRows=()=>Math.ceil(seatN()/seatCols());
function seatPos(j){const c=seatCols();return[c===4?182+(j%4)*44:176+(j%5)*40,62+Math.floor(j/c)*24]}
function setO(){O=(seatRows()-3)*24;H=440+O}
function mkStaff(role,st){
  const s={id:uid++,name:rname(),role,st:st||{hp:ri(2,5),res:ri(2,5),mental:ri(2,5),skill:ri(2,5)},lv:1,exp:0,pts:0,stress:ri(0,10),lunch:720,earn:0,
    look:{skin:pick(SKIN),hair:pick(HAIR),hs:r(3),top:role==='mgr'?'#3e5a8a':pick(['#5fb08a','#6fa8dc','#e891b0','#7fc4c0']),pants:'#3d4b5c'}};
  s.curHp=maxHp(s);return s;
}
function candPrice(st){const sum=st.hp+st.res+st.mental+st.skill;return Math.round((200000+sum*sum*6000)/10000)*10000}
function mkCands(){
  const tiers=[[1,3],[2,5],[3,7]];
  S.cands=tiers.map(([a,b])=>{const st={hp:ri(a,b),res:ri(a,b),mental:ri(a,b),skill:ri(a,b)};const s=mkStaff('pt',st);uid--;return{name:s.name,look:s.look,st,price:candPrice(st)}});
}

// ================= 상태 =================
let S=null,D=null,screen='title',sel=null,paused=false,speed=1,report=null,auto=false;
const KEY='seoulgreen_save_v2';
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function loadSave(){try{const s=localStorage.getItem(KEY);return s?JSON.parse(s):null}catch(e){return null}}
function newGame(){
  ac();uid=1;
  S={day:1,money:1000000,sat:60,level:1,chances:3,sofa:false,coffee:false,shock:1,manual:1,
    regs:[],staff:[mkStaff('mgr'),mkStaff('pt'),mkStaff('pt')],hist:[],complaints:[],monthRev:0,badDays:0,best:0,weather:'sun',cands:[]};
  mkCands();prepDay();
}
function continueGame(){ac();S=loadSave();if(!S){newGame();return}uid=Math.max(...S.staff.map(s=>s.id))+1;S.regs=S.regs||[];screen='prep';view()}
function prepDay(){const x=Math.random();S.weather=x<.6?'sun':x<.9?'rain':'snow';screen='prep';save();view()}
function dayCount(){return Math.round((20+S.level*10+(S.regs?S.regs.length/3:0))*(0.4+S.sat/100*1.6)*(S.weather==='rain'?1.3:S.weather==='snow'?.8:1)*(S.badDays>0?.7:1))}
function monthDay(d){return{m:Math.floor((d-1)/MONTH)+1,d:(d-1)%MONTH+1}}

function startDay(){
  ac();setO();
  const n=dayCount();
  D={t:DAY0,pats:[],pid:1,boss:null,bossAt:(S.day>=2&&Math.random()<.35)?ri(600,960):null,rev:0,served:0,lost:0,lambda:n/510,count:n,fx:[],msg:[],satStart:S.sat};
  const pts=S.staff.filter(s=>s.role==='pt');
  const order=['modal'];for(let k=0;k<4;k++){if(k<S.shock)order.push('shock'+k);if(k<S.manual)order.push('manual'+k)}
  for(const s of S.staff){Object.assign(s,{task:null,taskLeft:0,taskTot:1,moveTo:null,onLunch:false,lunchDone:false,rested:0,prevLoc:null,bossPrev:null,bub:null,autoCd:0,walk:0});s.curHp=maxHp(s)}
  for(const s of S.staff){s.loc=s.role==='mgr'?'recep':(order[pts.indexOf(s)]||'rest')}
  for(const s of S.staff){const[x,y]=spotOf(s,s.loc);s.x=x;s.y=y}
  if(S.newLv){S.newLv=false;D.party=performance.now();setTimeout(()=>{say('【축하】',`🎉 「${LEVELS[S.level-1]}」(으)로 새 단장 오픈! 대기실 ${seatN()}석`);sfx('win')},300)}
  sel=null;paused=false;screen='play';view();
  say(null,S.weather==='rain'?'🌧️ 비가 와요. 관절이 쑤시는 어르신들이 많이 오실 거예요.':S.weather==='snow'?'❄️ 눈이 와요. 환자가 조금 줄어들 거예요.':'☀️ 서울그린정형외과, 오늘도 영업 시작!');
}

// ================= 위치 =================
function dest(s){return s.moveTo||s.loc}
function roomInfo(loc){const k=+loc.replace(/\D/g,'');return{k,y0:(loc.startsWith('shock')?206:286)+O}}
function spotOf(s,L){
  const same=S.staff.filter(x=>dest(x)===L);const i=Math.max(0,same.indexOf(s));
  if(L==='recep')return[50+i*28,56];
  if(L==='modal'){if(s.task&&s.loc==='modal'){const p=D.pats.find(q=>q.id===s.task);if(p)return[p.tx-16,p.ty+4]}return[20,140+O+i*20]}
  if(L.startsWith('shock')||L.startsWith('manual')){const{k,y0}=roomInfo(L);return s.task&&s.loc===L?[k*90+30,y0+60]:[k*90+16,y0+46]}
  if(L==='rest')return[18+(i%7)*22,410+O+Math.floor(i/7)*16];
  if(L==='boss')return[200+(i%7)*20,430+O];
  return[s.x,s.y];
}
function bedPos(i,n){const two=n>6,per=two?Math.ceil(n/2):n,row=two?Math.floor(i/per):0;return[56+(i%per)*Math.floor(296/per),(two?150+row*30:160)+O]}
function layoutPatients(){
  const q=D.pats.filter(p=>p.stage==='recep'||p.stage==='reg').sort((a,b)=>a.id-b.id);
  const sy=50+seatRows()*24;let st=0;
  q.forEach((p,i)=>{p.stand=false;if(i<7){p.tx=60+i*16;p.ty=106}else{p.tx=176+(st%9)*20;p.ty=sy;st++;p.stand=true}});
  const w=D.pats.filter(p=>p.stage==='qmodal'||p.stage==='qshock'||p.stage==='qmanual').sort((a,b)=>a.qAt-b.qAt);
  const ns=seatN();w.forEach((p,j)=>{if(j<ns){[p.tx,p.ty]=seatPos(j);p.stand=false}else{p.tx=176+(st%9)*20;p.ty=sy;st++;if(!p.stand){p.stand=true;if(Math.random()<.3)bub(p,'앉을 데가 없네…')}}});
  const nb=beds(S.level);let extra=0;
  for(const p of D.pats){
    if(p.stage==='msetup'||p.stage==='modal'||p.stage==='mdone'){if(p.bed>=0&&p.bed<nb){const[x,y]=bedPos(p.bed,nb);p.tx=x+12;p.ty=y+6}else{p.tx=340-(extra%10)*18;p.ty=200+O;extra++}}
    if(p.stage==='tshock'||p.stage==='tmanual'){const{k,y0}=roomInfo((p.stage==='tshock'?'shock':'manual')+p.room);p.tx=k*90+52;p.ty=y0+52}
    if(p.stage==='exit'){p.tx=-24;p.ty=112}
  }
}
function step(e,dt){
  const dx=e.tx-e.x,dy=e.ty-e.y,d=Math.hypot(dx,dy),v=110*dt;
  if(d<=v||d<.5){e.x=e.tx;e.y=e.ty;e.walk=0;return true}
  e.x+=dx/d*v;e.y+=dy/d*v;e.walk+=dt*6;return false;
}
const arrived=e=>Math.hypot(e.tx-e.x,e.ty-e.y)<1.5;

// ================= 대사 =================
function bub(e,t,delay){if(!e)return;const n=performance.now()+(delay||0);e.bub={t,from:n,until:n+2600}}
const PAIRS=[['점심 뭐 먹을래?','김치찌개 콜!'],['오늘 환자 진짜 많다','버티자 파이팅…'],['원장님 오늘 기분 어때?','좋아 보이시던데?'],['퇴근하고 한잔?','오 좋지!'],['내 어깨도 누가 풀어줘…','나도 도수 받고 싶다'],['아까 그 어르신 귀여우셨지','사탕 주고 가셨어 ㅎㅎ'],['충격파 기계 또 뜨거워','잠깐 식히자']];
function chatter(){const idle=S.staff.filter(s=>!s.task&&!s.moveTo);if(idle.length<2)return;const a=pick(idle),b=pick(idle.filter(x=>x!==a)),pr=pick(PAIRS);bub(a,pr[0]);bub(b,pr[1],1400)}
function say(who,text){D.msg.push({who,text});if(D.msg.length>30)D.msg.shift()}
function fx(x,y,t,c){D.fx.push({x,y,t,c,until:performance.now()+1200})}

// ================= 게임 로직 =================
function spawn(){
  let type,look,reg=false;

function gain(s,kind){

function autoMove(s,cnt){

  if(--s.autoCd>0)return;s.autoCd=8;
  const here=dest(s),type=here==='recep'?'recep':here==='modal'?'modal':here.startsWith('shock')?'shock':here.startsWith('manual')?'manual':null;
  if(type&&cnt[type]>0)return;
  if(type==='modal'&&S.staff.filter(x=>x!==s&&dest(x)==='modal').length===0&&cnt.modal+D.pats.filter(p=>p.stage==='modal'||p.stage==='msetup').length>0)return;
  let best=null,score=0;
  const occ=l=>S.staff.some(x=>x!==s&&dest(x)===l);
  if(type==='recep'&&cnt.recep>0)return;
  if(cnt.recep>=3&&S.staff.filter(x=>x!==s&&dest(x)==='recep').length===0){best='recep';score=120+cnt.recep}
  if(cnt.modal>0&&!occ('modal')&&100+cnt.modal>score){best='modal';score=100+cnt.modal}
  for(let k=0;k<S.manual;k++)if(cnt.manual>0&&!occ('manual'+k)&&60+cnt.manual*10>score){best='manual'+k;score=60+cnt.manual*10}
  for(let k=0;k<S.shock;k++)if(cnt.shock>0&&!occ('shock'+k)&&50+cnt.shock*10>score){best='shock'+k;score=50+cnt.shock*10}
  if(best&&best!==here)go(s,best);
}

      else{const p=D.pats.filter(q=>q.stage==='recep'&&arrived(q)).sort((a,b)=>a.id-b.id)[0];
        if(p){p.stage='reg';s.task=p.id;s.taskTot=s.taskLeft=2*speedF(s)*(isM?1:1.8);if(Math.random()<.25)bub(s,isM?pick(L.mgr):pick(['어… 접수 화면이 어디더라','잠시만요, 실장님 자리라서…','성함 다시 한 번만요!']))}

    }

      if(s.task){const p=D.pats.find(q=>q.id===s.task);if(!p||p.stage==='exit'){s.task=null;s.tk=null;continue}

        let b=-1;if(p){const nb=beds(S.level),used=new Set(D.pats.filter(q=>(q.stage==='msetup'||q.stage==='modal'||q.stage==='mdone')&&q.bed>=0).map(q=>q.bed));for(let i=0;i<nb;i++)if(!used.has(i)){b=i;break}}

function areaAt(x,y){

  if(y<126+O)return x<150?'recep':null;
  if(y<206+O)return'modal';
  const k=Math.min(3,Math.floor(x/90));
  if(y<286+O)return'shock'+k;if(y<366+O)return'manual'+k;
  return x<180?'rest':'boss';
}

function addStat(id,k){const s=S.staff.find(x=>x.id===id);if(!s||s.pts<=0||s.st[k]>=15)return;s.st[k]++;s.pts--;if(k==='hp')s.curHp=maxHp(s);sfx('coin');save();view()}

// ================= 정산 =================
function endDay(){
  const lines=[];
  for(const s of S.staff){const r0=s.rested;let d=r0>=60?-10:r0>=30?10:30;if(r0>=60&&S.coffee)d-=10;s.stress=Math.max(0,s.stress+d);lines.push(`${s.name}: 휴게 ${Math.floor(r0)}분 → 스트레스 ${d>0?'+':''}${d}`)}
  const quits=[];for(const s of [...S.staff])if(s.stress>=100)quits.push(resign(s));
  for(const s of S.staff){s.stress=Math.max(0,s.stress-5);s.curHp=maxHp(s)}
  let extra=0;if(!S.staff.some(s=>s.role==='mgr')){S.staff.push(mkStaff('mgr'));extra=500000;S.money-=extra;quits.push('🧑‍💼 새 실장님을 급히 채용했어요 (500,000원)')}
  let pay=null;
  if(S.day%MONTH===0){
    const rows=S.staff.map(s=>({name:s.name+(s.role==='mgr'?' (실장·관리수당 포함)':''),amt:Math.round(s.earn+(s.role==='mgr'?S.monthRev*.03:0))}));
    const rent=S.level*1000000;rows.push({name:'임대료·운영비',amt:rent});
    const total=rows.reduce((a,b)=>a+b.amt,0);S.money-=total;
    pay={rows,total,monthRev:S.monthRev};S.monthRev=0;S.staff.forEach(s=>s.earn=0);
  }
  S.hist.push({d:S.day,rev:D.rev,pay:pay?pay.total:0});if(S.hist.length>40)S.hist.shift();
  S.best=Math.max(S.best,D.rev);if(S.badDays>0)S.badDays--;
  report={day:S.day,rev:D.rev,served:D.served,lost:D.lost,sat0:D.satStart,lines,quits,pay,extra};
  S.day++;mkCands();
  if(pay&&S.money<0){screen='over';try{localStorage.removeItem(KEY)}catch(e){}view();return}
  save();screen='end';sfx('win');view();
}
function buy(k){
  const items=shopItems(),it=items.find(x=>x.k===k);if(!it||it.done)return;
  if(S.money<it.cost){toast('돈이 부족해요');sfx('bad');return}
  S.money-=it.cost;
  if(k==='mbed')S.mbeds=(S.mbeds||0)+1;if(k==='shock')S.shock++;if(k==='manual')S.manual++;if(k==='sofa')S.sofa=true;if(k==='coffee')S.coffee=true;
  if(k==='party'){S.staff.forEach(s=>s.stress=Math.max(0,s.stress-25));toast('🍻 다들 기분이 좋아졌어요')}
  if(k==='level'){S.level++;S.newLv=true;S.chances=Math.min(3,S.chances+1);toast(`🏥 「${LEVELS[S.level-1]}」(으)로 확장! 원장님 찬스 +1`)}
  sfx('coin');save();view();
}
function hire(i){
  const c=S.cands[i];if(!c)return;if(S.money<c.price){toast('돈이 부족해요');sfx('bad');return}
  S.money-=c.price;const s=mkStaff('pt',{...c.st});s.name=c.name;s.look=c.look;S.staff.push(s);S.cands.splice(i,1);
  toast(`🎉 ${s.name} 선생님 입사!`);sfx('win');save();view();
}
function shopItems(){
  const sl=slots(S.level);
  return[
    {k:'shock',name:'💥 충격파실 추가',cost:2000000*S.shock,desc:`보유 ${S.shock} / 현재 레벨 최대 ${sl}`,done:S.shock>=sl},
    {k:'manual',name:'🙌 도수치료실 추가',cost:2500000*S.manual,desc:`보유 ${S.manual} / 현재 레벨 최대 ${sl}`,done:S.manual>=sl},
    {k:'mbed',name:'🛏️ 모달 침대 추가',cost:300000*((S.mbeds||0)+1),desc:`현재 ${beds(S.level)}개 (최대 12개) · 동시에 받는 모달 환자 +1`,done:beds(S.level)>=12},
    {k:'sofa',name:'🛋️ 대기실 소파',cost:300000,desc:'환자 인내심 +20%',done:S.sofa},
    {k:'coffee',name:'☕ 커피머신',cost:400000,desc:'점심을 다 쉬면 스트레스 추가 −10',done:S.coffee},
    {k:'party',name:'🍻 회식',cost:300000+S.staff.length*50000,desc:'전원 스트레스 −25'},
    {k:'level',name:`🏥 병원 확장 → Lv.${S.level+1}`,cost:lvCost(S.level),desc:S.level>=10?'최고 레벨이에요':`「${LEVELS[S.level]}」 · 환자↑ · 대기 좌석 +2 · 의자·조명·창문 업그레이드 · 원장님 찬스 +1`,done:S.level>=10}
  ];

function locName(l){if(!l)return'';if(l==='recep')return'접수대';if(l==='rest')return'휴게실';if(l==='boss')return'민원 상담실';if(l==='modal')return'모달실';const{k}=roomInfo(l);return(l.startsWith('shock')?'충격파 ':'도수 ')+(k+1)}
function staffStatus(s){
  if(s.onLunch)return s.loc==='rest'?`🍱 점심 ${Math.floor(s.rested)}/60분`:'🍱 휴게실로 가는 중';

  if(s.task)return s.loc==='recep'?'📝 접수 중':'💪 '+locName(s.loc)+' 치료 중';

function drawChart(){
  const c=document.getElementById('chart');if(!c)return;
  const w=c.clientWidth||300,h=170;c.width=w*DPR;c.height=h*DPR;const g=c.getContext('2d');g.scale(DPR,DPR);
  const data=S.hist.slice(-13).map(x=>({l:'D'+x.d,v:x.rev,pay:x.pay}));data.push({l:'오늘',v:D?D.rev:0,today:1});
  const mx=Math.max(100000,...data.map(d=>d.v))*1.15,L0=34,B=h-18,T=8,bw=Math.min(34,(w-L0-6)/data.length);
  g.font='10px Jua,sans-serif';g.fillStyle='#c3cbf0';g.strokeStyle='rgba(255,255,255,.15)';g.lineWidth=1;
  for(let i=0;i<=3;i++){const y=B-(B-T)*i/3;g.beginPath();g.moveTo(L0,y);g.lineTo(w-4,y);g.stroke();g.fillText(man(mx*i/3).replace('.0',''),2,y+3)}
  data.forEach((d,i)=>{const x=L0+i*bw+bw*.15,bh=(B-T)*d.v/mx;g.fillStyle=d.today?'#ffd54a':'#7fd6a4';g.fillRect(x,B-bh,bw*.7,bh);
    if(d.pay){g.fillStyle='#ff8a8a';g.fillText('월급',x-2,T+8)}
    if(i%2===data.length%2||d.today){g.fillStyle='#c3cbf0';g.fillText(d.l,x-2,h-4)}});
  const note=document.getElementById('chartnote');if(note)note.textContent=`이번 달 매출 ${won(S.monthRev)} · 최고 하루 ${won(Math.max(S.best,D?D.rev:0))}`;
}

const DPR=Math.min(3,window.devicePixelRatio||2);
let ctx=null;
function px(c,x,y,w,h){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),w,h)}
function txt(t,x,y,c,size,al){ctx.font=(size||9)+'px Jua,sans-serif';ctx.textAlign=al||'left';ctx.fillStyle=c||'#333';ctx.fillText(t,x,y);ctx.textAlign='left'}

let AC=null,soundOn=true,bgmStep=0,bgmT=0;
function ac(){try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){}return AC}
function tone(f,d,type,v,w){if(!soundOn||!AC)return;try{const t=AC.currentTime+(w||0),o=AC.createOscillator(),g=AC.createGain();o.type=type||'square';o.frequency.value=f;g.gain.setValueAtTime(v||.05,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.02)}catch(e){}}
function sfx(k){
  if(k==='coin'){tone(988,.07);tone(1319,.12,'square',.05,.07)}
  else if(k==='door'){tone(784,.1,'sine',.06);tone(659,.14,'sine',.06,.1)}
  else if(k==='bad'){tone(220,.2,'sawtooth',.05);tone(165,.25,'sawtooth',.05,.18)}
  else if(k==='boss'){[440,415,392,370].forEach((f,i)=>tone(f,.15,'sawtooth',.06,i*.15))}
  else if(k==='win'){[523,659,784,1047].forEach((f,i)=>tone(f,.12,'square',.05,i*.1))}
  else if(k==='chance'){[392,523,659,784,1047].forEach((f,i)=>tone(f,.1,'triangle',.07,i*.07))}
  else if(k==='tap'){tone(1200,.03,'square',.03)}
}

let curTrack=null,dayRot=0;
function pickTrack(){if(D.boss)return'boss';if(D.t>=690&&D.t<810)return'lunch';if(D.t>=1000)return'eve';return['t1','t2','t3','t4'][dayRot%4]}
function bgm(now){
  if(!soundOn||!AC||screen!=='play'||paused||!D)return;
  const k=pickTrack();if(k!==curTrack){curTrack=k;bgmStep=0;toast(TRACKS[k].name)}
  const T=TRACKS[k];if(now-bgmT<T.iv)return;bgmT=now;
  const n=T.f[bgmStep%T.f.length],soft=T.w==='square'||T.w==='sawtooth';
  if(n)tone(n,T.iv/1000*.75,T.w,soft?.014:.024);
  if(bgmStep%4===0)tone((n||T.f[0])/2,T.iv/1000*1.8,'triangle',.026);
  bgmStep++;if(bgmStep%64===0&&!['boss','lunch','eve'].includes(k))dayRot++;
}
